[project]
name = "galaius-core"
version = "0.45.0"
description = "Provider-independent wire contracts for Galaius clients and services"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.13.1,<3", "cryptography>=46"]

[dependency-groups]
dev = ["pytest>=9.0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/galaius_core"]
